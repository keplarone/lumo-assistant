name: On-device models

# Checks the built-in engine against real models: every pinned Hugging Face download (models and image
# projectors) must match its size and SHA-256, Orbit (Qwen3 4B) must chat and call a tool on each OS,
# and Nebula Vision (Qwen3-VL 8B) must see a screenshot and click the right spot. Runs when the engine
# or catalog changes, and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/model/local/**
      - apps/desktop/src-tauri/src/local_models.rs
      - apps/desktop/src-tauri/src/tools/computer.rs
      - apps/desktop/src-tauri/Cargo.toml
      - .github/workflows/model-smoke.yml
      - .github/scripts/check_model_pins.py

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libxcb1-dev libxrandr-dev libdbus-1-dev libvulkan-dev glslc spirv-headers

jobs:
  pins:
    name: Model downloads match their pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_model_pins.py

  smoke:
    name: Orbit chats and calls a tool (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
        shell: bash
      - name: Download Orbit from its pinned URL and check its SHA-256
        shell: bash
        working-directory: .
        run: |
          # tr: Python on Windows ends the line with \r\n.
          read -r url sha < <(python3 .github/scripts/check_model_pins.py qwen3:4b | tr -d '\r')
          curl -fL --retry 3 -o "$RUNNER_TEMP/orbit.gguf" "$url"
          python3 -c "import hashlib,sys;h=hashlib.sha256();f=open(sys.argv[1],'rb');[h.update(b) for b in iter(lambda:f.read(1<<20),b'')];sys.exit(h.hexdigest()!=sys.argv[2])" "$RUNNER_TEMP/orbit.gguf" "$sha"
          echo "LUMO_SMOKE_GGUF=$RUNNER_TEMP/orbit.gguf" >> "$GITHUB_ENV"
      # Default shell on purpose: under Git Bash, Windows picks up MSYS perl, which can't build OpenSSL.
      - name: Chat and tool call through the engine
        # GitHub's Macs only have a paravirtual GPU, on which llama.cpp's Metal kernels return garbage
        # (no simdgroup support), so test the CPU path there. Real Apple silicon Macs use Metal.
        env:
          LUMO_GPU: ${{ runner.os == 'macOS' && 'off' || '' }}
        run: cargo test --lib ${{ runner.os == 'Linux' && '--features vulkan' || '' }} smoke -- --ignored --nocapture --test-threads=1

  vision:
    name: Nebula Vision clicks the red button (ubuntu-24.04, CPU)
    runs-on: ubuntu-24.04
    # An 8B vision model on a 4-core runner without a GPU: reading the screenshot and the prompt takes
    # a few minutes per attempt, and the test asks three times.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the model (5.8 GB) and the build
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - name: Download Nebula Vision and its projector from their pinned URLs and check their SHA-256
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/vl"
          python3 .github/scripts/check_model_pins.py qwen3-vl:8b > "$RUNNER_TEMP/vl/pins.txt"
          test "$(wc -l < "$RUNNER_TEMP/vl/pins.txt")" -eq 2
          while read -r url sha; do
            out="$RUNNER_TEMP/vl/${url##*/}"
            curl -fL --retry 3 -o "$out" "$url"
            echo "$sha  $out" | sha256sum -c -
          done < "$RUNNER_TEMP/vl/pins.txt"
          echo "LUMO_SMOKE_VL_GGUF=$RUNNER_TEMP/vl/Qwen3VL-8B-Instruct-Q4_K_M.gguf" >> "$GITHUB_ENV"
          echo "LUMO_SMOKE_VL_MMPROJ=$RUNNER_TEMP/vl/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf" >> "$GITHUB_ENV"
      - name: See a synthetic screen and click its red button through the engine
        env:
          LUMO_GPU: 'off'
        run: cargo test --lib smoke_vision -- --ignored --nocapture --test-threads=1
