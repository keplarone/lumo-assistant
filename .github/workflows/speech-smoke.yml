name: On-device speech

# Checks Lumo's built-in speech-to-text against the real model: every pinned Hugging Face download must
# match its size and SHA-256, and Whisper must transcribe a spoken sentence on each OS. Runs when the
# speech code changes, and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/stt/**
      - apps/desktop/src-tauri/Cargo.toml
      - .github/workflows/speech-smoke.yml
      - .github/scripts/check_speech_pins.py

concurrency:
  group: speech-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libxcb1-dev libxrandr-dev libdbus-1-dev

jobs:
  pins:
    name: Speech model downloads match their pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_speech_pins.py

  speech:
    name: Whisper transcribes real speech (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS espeak-ng
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
        shell: bash
      - name: Download the pinned speech model (checked against its SHA-256)
        working-directory: .
        run: python3 .github/scripts/check_speech_pins.py "${{ runner.temp }}/whisper"
      # The sentence is spoken by each OS's own text-to-speech, so the test hears real audio.
      - if: runner.os == 'Linux'
        run: espeak-ng -s 150 -w "$RUNNER_TEMP/speech.wav" "What will the weather be like tomorrow?"
      - if: runner.os == 'macOS'
        run: say --data-format=LEI16@16000 -o "$RUNNER_TEMP/speech.wav" "What will the weather be like tomorrow?"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $s.Speak("What will the weather be like tomorrow?")
          $s.Dispose()
      - name: Transcribe it on the CPU
        env:
          LUMO_SMOKE_WHISPER: ${{ runner.temp }}/whisper
          LUMO_SMOKE_WAV: ${{ runner.temp }}/speech.wav
        run: cargo test --lib smoke_whisper -- --ignored --nocapture
