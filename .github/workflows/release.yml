name: Release

# Builds signed installers for macOS, Windows and Linux when a version tag is pushed, and attaches
# them to a draft GitHub release. See docs/release.md for the secrets this needs and the checklist
# to complete before publishing the draft.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: windows-2022
            args: ''
          # Vulkan GPU support for on-device models (see docs/release.md); Windows stays CPU-only for now.
          - platform: ubuntu-24.04
            args: '--features vulkan'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libxcb1-dev libxrandr-dev libdbus-1-dev libvulkan-dev glslc spirv-headers
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Enable updater artifacts when a signing key is configured
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PUBKEY" ]; then
            echo "args=--config {\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$PUBKEY\"}}}" >> "$GITHUB_OUTPUT"
          fi
      # Empty signing variables make the bundler try to sign and fail, so pass them only when set.
      - name: Use code-signing secrets only when they are configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set_if() { if [ -n "${!1}" ]; then { echo "$1<<__LUMO_EOF__"; echo "${!1}"; echo "__LUMO_EOF__"; } >> "$GITHUB_ENV"; fi; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do set_if "$v"; done
          fi
          if [ -n "$APPLE_ID" ]; then
            for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do set_if "$v"; done
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do set_if "$v"; done
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (optional until set; without it the app builds with updates disabled).
          LUMO_UPDATER_PUBKEY: ${{ secrets.LUMO_UPDATER_PUBKEY }}
          # Whop license server URL. Defaults to the deployed lumo-license project; override with a repository variable.
          LUMO_LICENSE_SERVER: ${{ vars.LUMO_LICENSE_SERVER || 'https://lumo-license.vercel.app/api/validate' }}
          # Optional Whop checkout URL overrides (repository variables); default is whop.com/checkout/<plan>.
          LUMO_WHOP_CHECKOUT_LITE: ${{ vars.LUMO_WHOP_CHECKOUT_LITE }}
          LUMO_WHOP_CHECKOUT_PRO: ${{ vars.LUMO_WHOP_CHECKOUT_PRO }}
          LUMO_WHOP_CHECKOUT_UNLIMITED: ${{ vars.LUMO_WHOP_CHECKOUT_UNLIMITED }}
          # Signing secrets (updater, Apple) arrive through GITHUB_ENV from the step above when configured.
        with:
          projectPath: apps/desktop
          # The tag comes from the app version, so a manual run (workflow_dispatch) also creates it.
          tagName: v__VERSION__
          releaseName: Lumo v__VERSION__
          releaseBody: See the assets below. Read docs/release.md before publishing.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
