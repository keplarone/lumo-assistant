# llama.cpp (the on-device engine) is compiled for the Rust target's baseline CPU unless told
# otherwise, which on x86-64 means SSE2 only and several times slower inference. Enable the
# instruction sets every x86-64 computer from 2013 on has (Haswell and later). ggml ignores these on
# ARM. Set any of them to OFF in the environment to build for older CPUs.
[env]
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
