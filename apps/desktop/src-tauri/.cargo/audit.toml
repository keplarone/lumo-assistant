# Advisories reviewed and accepted. Each entry says why it can't reach Lumo; remove it once the
# dependency moves past the affected version.
[advisories]
ignore = [
    # zip 4.6.1, pulled in by tauri-plugin-updater 2.14, which pins zip ^4 (no 2.x release allows
    # zip 9). All three are in ZipArchive::extract. The updater calls it only on Windows, only for a
    # .zip update bundle, and only after the bundle's minisign signature checks out against Lumo's
    # own updater key, so the archive can't be attacker-controlled without that key. Lumo's own zip
    # use (Netlify deploys) is on zip 9 and only writes archives. Drop these when the updater allows
    # zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
