# cargo audit settings for the desktop core.
#
# expires: 2026-11-16
# CI fails after this date (see the "Dependency audit" job), so the ignore below has to be
# re-checked rather than forgotten. Remove it as soon as tauri-plugin-updater ships with zip >= 9.

[advisories]
# zip 4.6.1, pulled in only by tauri-plugin-updater 2.14.0 (the latest release), and only on
# Windows. All three advisories are about ZipArchive::extract writing attacker-chosen symlinks or
# permission bits. The updater calls extract only after the whole download has passed its
# signature check against Lumo's updater public key, so an attacker would need Lumo's private
# signing key to reach it, and with that key they could ship a malicious update anyway.
# Lumo's own zip dependency is on 9, which fixes all three.
ignore = [
  "RUSTSEC-2026-0367", # SUID/SGID bits kept on extract (Unix only)
  "RUSTSEC-2026-0368", # extract creates symlinks pointing outside the destination
  "RUSTSEC-2026-0369", # extract applies permissions through symlinks
]
