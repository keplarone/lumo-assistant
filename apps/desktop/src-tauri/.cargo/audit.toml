# Advisories reviewed and accepted. Each entry says why it can't reach Lumo; remove it once the
# dependency moves past the affected version.
[advisories]
ignore = [
    # zip 8.6.0, pulled in by candle-core 0.11 (on-device speech-to-text), which pins zip ^8.6.
    # All three are in ZipArchive::extract / ZipStreamReader::extract, which unpack an archive onto
    # disk. Neither candle nor Lumo calls them: candle only reads entries by name for .npz/.pth files,
    # and Lumo only loads the speech model's pinned, checksummed .safetensors. Drop these when
    # candle-core allows zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
