[package]
name = "lumo"
version = "0.2.0"
description = "Lumo Assistant"
authors = ["Keplar"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "query", "form", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
url = "2"
regex = "1"
dirs = "6"
walkdir = "2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
cron = "0.17"
mime_guess = "2"
html2text = "0.17"
async-trait = "0.1"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

# Computers only: phones have no tray, global shortcut or self-update, don't let apps capture or
# control the screen, and keep secrets in their own stores (below). See src/device.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
keyring = "4.2"
trash = "5"
xcap = { version = "0.7", default-features = false }
enigo = "0.6"

# Phones keep secrets in the iOS Keychain (data protection, this device only) or in storage
# encrypted with an Android Keystore key, through the same keyring interface.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Current location (src/location/macos.rs): CoreLocation.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLError", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

# Current location (src/location/windows.rs): Windows.Devices.Geolocation. Same version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }

# Current location (src/location/linux.rs): GeoClue2 over D-Bus. Already used by Tauri's plugins.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
