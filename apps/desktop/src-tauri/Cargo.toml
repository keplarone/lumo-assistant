[package]
name = "lumo"
version = "0.2.0"
description = "Lumo Assistant"
authors = ["Keplar"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2.5"
# No `zip` feature: release builds ship v2 updater artifacts (signed .exe, .msi, .AppImage and
# .app.tar.gz), none of which need it, and it pulls in an old zip with open advisories.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-log = "2.10"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "query", "form", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
keyring = "4.2"
thiserror = "2"
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
url = "2"
regex = "1"
dirs = "6"
walkdir = "2"
trash = "5"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
cron = "0.17"
mime_guess = "2"
html2text = "0.17"
async-trait = "0.1"
parking_lot = "0.12"
xcap = { version = "0.7", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
enigo = "0.6"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Current location (src/location/macos.rs): CoreLocation.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLError", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

# Current location (src/location/windows.rs): Windows.Devices.Geolocation. Same version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }

# Current location (src/location/linux.rs): GeoClue2 over D-Bus. Already used by Tauri's plugins.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
