<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumo icon renderer</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      /* The app icon tile: a soft white-to-blue squircle with Lumo in front. */
      #tile {
        position: relative;
        width: 512px;
        height: 512px;
        border-radius: 22.5%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #ffffff 0%, #eaf2ff 45%, #b9d3ff 100%);
        box-shadow: inset 0 -18px 40px rgba(47, 107, 255, 0.22);
      }
      #tile[data-plain] {
        background: transparent;
        box-shadow: none;
        border-radius: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="tile"><canvas id="c"></canvas></div>
    <script type="module" src="./icon.ts"></script>
  </body>
</html>
